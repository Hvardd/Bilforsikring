spring.application.name=car-insurance
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:car_insurance}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:car_insurance}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
