# Activate with SPRING_PROFILES_ACTIVE=prod.
# No local database/origin fallbacks in production. Credentials stay in the environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.frontend-origin=${FRONTEND_ORIGIN}

# Flyway uses the same database and credentials as the mocked core repositories.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Database availability affects readiness, not whether the process should be restarted.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-components=never
